<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#121212">
  <title>Mentions Légales — Estelle Boisserie</title>
  <link rel="icon" href="assets/imgs/logo.png" type="image/PNG">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  <script src="translations.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>

  <!-- Main Navigation -->
  <header class="navbar scrolled" style="border-bottom: 1px solid var(--glass-border);">
    <div class="nav-inner">
      <a href="index.html" class="logo-wrapper" aria-label="Retour accueil">
        <svg class="logo-svg" viewBox="0 0 100 40" width="80" height="32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <text x="5" y="30" font-family="Outfit, sans-serif" font-size="32" font-weight="800" fill="currentColor">E<tspan fill="#d1345b">.</tspan>B</text>
        </svg>
      </a>

      <div class="lang-switch" role="group" aria-label="Choisir la langue" data-i18n-aria-label="nav.languageLabel" style="margin-left: auto; margin-right: 20px;">
        <button type="button" class="lang-option is-active" data-lang="fr" aria-pressed="true">FR</button>
        <button type="button" class="lang-option" data-lang="en" aria-pressed="false">EN</button>
      </div>

      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Changer de thème clair ou sombre" data-i18n-aria-label="nav.themeToggleLabel" style="margin-right: 15px;">
        <span class="icon-dark" aria-hidden="true">&#9789;</span>
        <span class="icon-light" aria-hidden="true">&#9728;</span>
      </button>

      <a href="index.html" class="btn btn-outline" style="padding: 8px 16px; font-size: 0.85rem;" data-i18n="legal.backBtn"></a>
    </div>
  </header>

  <!-- Legal Content -->
  <main id="main-content" style="padding-top: 140px; padding-bottom: 80px;">
    <section class="section-inner">
      <h1 class="section-title" style="margin-bottom: 40px;" data-i18n="legal.title"></h1>
      
      <div class="glass-card" style="padding: 40px; color: var(--text-1);">
        <h2 style="color: var(--text-0); font-family: var(--font-display); margin-bottom: 15px; font-size: 1.4rem;" data-i18n="legal.editorTitle"></h2>
        <p class="text-justify" style="margin-bottom: 25px;" data-i18n-html="legal.editorText"></p>

        <h2 style="color: var(--text-0); font-family: var(--font-display); margin-bottom: 15px; font-size: 1.4rem;" data-i18n="legal.hostTitle"></h2>
        <p class="text-justify" style="margin-bottom: 25px;" data-i18n-html="legal.hostText"></p>

        <h2 style="color: var(--text-0); font-family: var(--font-display); margin-bottom: 15px; font-size: 1.4rem;" data-i18n="legal.dataTitle"></h2>
        <p class="text-justify" style="margin-bottom: 25px;" data-i18n-html="legal.dataText"></p>

        <h2 style="color: var(--text-0); font-family: var(--font-display); margin-bottom: 15px; font-size: 1.4rem;" data-i18n="legal.cookiesTitle"></h2>
        <p class="text-justify" style="margin-bottom: 25px;" data-i18n-html="legal.cookiesText"></p>

        <h2 style="color: var(--text-0); font-family: var(--font-display); margin-bottom: 15px; font-size: 1.4rem;" data-i18n="legal.ipTitle"></h2>
        <p class="text-justify" data-i18n-html="legal.ipText"></p>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="section-inner footer-inner">
      <a href="index.html" class="logo">E<span class="logo-dot">.</span>B</a>
      <p class="footer-text">
        &copy; <span id="year"></span> <span data-i18n="footer.text"></span>
        <span style="margin: 0 10px;">|</span> <a href="https://github.com/estelle-bsr/portfolio" target="_blank" rel="noopener" data-i18n="footer.github" class="legal-link"></a>
      </p>
    </div>
  </footer>

</body>
</html>
